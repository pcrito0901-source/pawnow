<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PawNow サポート</title>
<meta name="description" content="PawNow のお問い合わせ窓口">
<style>
:root{
  /* colors: design tokens */
  --bg:#010103; --bg-secondary:#16171A; --border:#2E3035; --border-strong:#474A50;
  --text:#F9FAFB; --text-secondary:#B0B3B8; --text-muted:#8E9196; --link:#2B81FD;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.75;overflow-wrap:anywhere;word-break:normal}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header.site{border-bottom:1px solid var(--border)}
header.site .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding-top:12px;padding-bottom:12px}
header.site .brand{font-weight:700;font-size:17px;color:var(--text);text-decoration:none;margin-right:auto}
nav a{font-size:13px}
a{color:var(--link)}
a:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
main{padding-top:24px;padding-bottom:48px}
h1{font-size:28px;line-height:1.25;margin:0 0 24px}
h2{font-size:20px;line-height:1.25;margin:32px 0 12px}
h3{font-size:17px;line-height:1.25;margin:24px 0 8px}
p{margin:0 0 12px}
hr{border:0;border-top:1px solid var(--border);margin:32px 0}
blockquote{margin:0 0 16px;padding:12px 16px;background:var(--bg-secondary);border-left:4px solid var(--border-strong);border-radius:8px;color:var(--text-secondary)}
blockquote p:last-child{margin-bottom:0}
ol,ul{margin:0 0 12px;padding-left:24px}
li{margin:0 0 4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--bg-secondary);border-radius:4px;padding:1px 4px}
.table-wrap{max-width:100%;overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.5}
th,td{border:1px solid var(--border);padding:8px;text-align:left;vertical-align:top}
th{background:var(--bg-secondary);font-weight:600}
.lead{font-size:17px;color:var(--text-secondary);margin:0 0 8px}
.kicker{font-size:13px;color:var(--text-muted);margin:0 0 4px}
.links{list-style:none;padding:0;margin:0 0 24px}
.links li{margin:0}
.links a{display:block;padding:12px 0;min-height:44px;border-bottom:1px solid var(--border);text-decoration:none;font-size:17px}
footer.site{border-top:1px solid var(--border);color:var(--text-muted);font-size:13px}
footer.site .wrap{padding-top:16px;padding-bottom:32px}
footer.site nav{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:8px}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">PawNow</a>
    <nav aria-label="ページ">
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="terms.html">利用規約</a>
      <a href="support.html" aria-current="page">サポート</a>
    </nav>
  </div>
</header>
<main class="wrap">
<h1>PawNow サポート</h1>
<h2>お問い合わせ窓口</h2>
<p>田中琉斗<br>
連絡先: <a href="mailto:rito901ap@gmail.com">rito901ap@gmail.com</a></p>
<p>住所および電話番号は、<strong>ご請求があったときに遅滞なく開示します。</strong><br>
上記の連絡先までお申し出ください。</p>
<ul class="links">
  <li><a href="privacy.html">プライバシーポリシー</a></li>
  <li><a href="terms.html">利用規約</a></li>
</ul>
</main>
<footer class="site">
  <div class="wrap">
    <nav aria-label="フッター">
      <a href="index.html">PawNow</a>
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="terms.html">利用規約</a>
      <a href="support.html">サポート</a>
    </nav>
    <div>田中琉斗 ・ <a href="mailto:rito901ap@gmail.com">rito901ap@gmail.com</a></div>
  </div>
</footer>
</body>
</html>
